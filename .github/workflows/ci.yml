name: CI

on:
  pull_request:
    branches:
      - dev
      - beta
      - main
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  promotion-path:
    name: Validate promotion path
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Enforce feature to dev to beta to main
        if: github.event_name == 'pull_request'
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
        shell: bash
        run: |
          case "$BASE_BRANCH" in
            dev)
              [[ "$HEAD_BRANCH" != dev && "$HEAD_BRANCH" != beta && "$HEAD_BRANCH" != main ]]
              ;;
            beta)
              [[ "$HEAD_BRANCH" == dev ]]
              ;;
            main)
              [[ "$HEAD_BRANCH" == beta ]]
              ;;
            *)
              echo "Unsupported target branch: $BASE_BRANCH" >&2
              exit 1
              ;;
          esac

  supply-chain:
    name: Vulnerability, secret, license, and SBOM checks
    if: github.event_name != 'pull_request' || github.base_ref == 'dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source and scan history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go for reachability analysis
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.12'
          cache: false

      - name: Fetch checksum-pinned security tools
        run: build/security/fetch-tools.sh "$RUNNER_TEMP/osverse-security-tools"

      - name: Scan Git history for secrets
        run: |
          "$RUNNER_TEMP/osverse-security-tools/gitleaks" git --redact --no-banner .

      - name: Scan dependency vulnerabilities and licenses
        run: |
          "$RUNNER_TEMP/osverse-security-tools/osv-scanner" scan source --recursive --call-analysis=go \
            --licenses='0BSD,Apache-2.0,BlueOak-1.0.0,BSD-2-Clause,BSD-3-Clause,CC-BY-4.0,CC0-1.0,ISC,LGPL-3.0-or-later,MIT,MIT-0,MPL-2.0,Python-2.0,Unlicense' \
            .

      - name: Generate and validate SPDX SBOM
        run: |
          "$RUNNER_TEMP/osverse-security-tools/syft" dir:. \
            --source-name Osverse --source-version "$GITHUB_SHA" \
            --output spdx-json=/tmp/osverse.spdx.json
          python3 - <<'PY'
          import json
          with open('/tmp/osverse.spdx.json', encoding='utf-8') as source:
              document = json.load(source)
          assert document['spdxVersion'].startswith('SPDX-2.')
          assert document['SPDXID'] == 'SPDXRef-DOCUMENT'
          assert document['packages']
          PY

  go:
    name: Go tests and vet
    if: github.event_name != 'pull_request' || github.base_ref == 'dev'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.12'
          cache: false

      - name: Install Go test native dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            build-essential \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev \
            pkg-config

      - name: Verify Go version
        shell: bash
        run: test "$(go env GOVERSION)" = 'go1.25.12'

      - name: Run Go tests
        run: |
          go mod verify
          go test ./...

      - name: Run race tests
        run: go test -race ./...

      - name: Run Go vet
        run: go vet ./...

      - name: Compile portable CLI installers for future macOS targets
        run: |
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go test -c -o /tmp/harnessinstall-darwin-amd64.test ./internal/harnessinstall
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go test -c -o /tmp/harnessinstall-darwin-arm64.test ./internal/harnessinstall
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go test -c -o /tmp/qweninstall-darwin-amd64.test ./internal/qweninstall
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go test -c -o /tmp/qweninstall-darwin-arm64.test ./internal/qweninstall
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go test -c -o /tmp/copilotinstall-darwin-amd64.test ./internal/copilotinstall
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go test -c -o /tmp/copilotinstall-darwin-arm64.test ./internal/copilotinstall

  frontend:
    name: Frontend tests and build
    if: github.event_name != 'pull_request' || github.base_ref == 'dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false

      - name: Verify Node.js version
        shell: bash
        run: test "$(node --version)" = 'v22.23.2'

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Run frontend tests
        run: npm --prefix frontend test

      - name: Type-check frontend
        run: npm --prefix frontend run typecheck

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Audit dependency graph
        run: |
          npm --prefix frontend audit --audit-level=high
          npm --prefix internal/harnessinstall/assets audit --omit=dev --package-lock-only --audit-level=high

      - name: Audit responsive desktop breakpoints
        run: npm --prefix frontend run audit:responsive

  windows:
    name: Windows tests, installer, and smoke
    if: github.event_name != 'pull_request' || github.base_ref == 'dev'
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.12'
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false

      - name: Verify Windows toolchain
        shell: pwsh
        run: |
          if ((go env GOVERSION) -ne 'go1.25.12') { throw 'Unexpected Go version.' }
          if ((node --version) -ne 'v22.23.2') { throw 'Unexpected Node.js version.' }
          if ($env:PROCESSOR_ARCHITECTURE -ne 'AMD64') { throw 'Unexpected runner architecture.' }

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Run native Windows tests and vet
        shell: pwsh
        run: |
          go mod verify
          go test ./...
          go test -race ./...
          go vet ./...

      - name: Test and audit frontend
        shell: pwsh
        run: |
          npm --prefix frontend test
          npm --prefix frontend run typecheck
          npm --prefix frontend audit --audit-level=high
          npm --prefix internal/harnessinstall/assets audit --omit=dev --package-lock-only --audit-level=high

      - name: Build user-scoped NSIS installer
        shell: pwsh
        run: go run github.com/wailsapp/wails/v2/cmd/wails@v2.13.0 build -platform windows/amd64 -nsis -webview2 embed -installscope user -trimpath

      - name: Package and verify Windows release candidates
        shell: pwsh
        run: |
          ./build/windows/package.ps1 -Version 0.0.0-ci -Binary build/bin/osverse.exe -Installer build/bin/osverse-amd64-installer.exe -OutputDirectory build/release/windows
          Push-Location build/release/windows
          Get-Content SHA256SUMS-windows-amd64 | ForEach-Object {
            $parts = $_ -split '  ', 2
            if ((Get-FileHash -LiteralPath $parts[1] -Algorithm SHA256).Hash.ToLowerInvariant() -ne $parts[0]) { throw "Checksum mismatch: $($parts[1])" }
          }
          Pop-Location

      - name: Install, launch, and remove Windows package
        shell: pwsh
        run: ./build/windows/smoke.ps1 -Installer build/release/windows/osverse-0.0.0-ci-windows-amd64-setup.exe

      - name: Upload Windows release candidates
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: osverse-windows-amd64
          path: build/release/windows/*
          if-no-files-found: error
          retention-days: 7

  linux-webkitgtk-4:
    name: Ubuntu 22.04 WebKitGTK 4.0 build
    if: github.event_name != 'pull_request' || github.base_ref == 'dev'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.12'
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false

      - name: Install native build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            build-essential \
            curl \
            ca-certificates \
            file \
            gnupg \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev \
            pkg-config \
            policykit-1 \
            squashfs-tools \
            xauth \
            xdotool \
            xvfb

      - name: Verify build toolchain
        shell: bash
        run: |
          test "$(go env GOVERSION)" = 'go1.25.12'
          test "$(node --version)" = 'v22.23.2'
          test "$(uname -m)" = 'x86_64'
          dpkg --compare-versions "$(pkg-config --modversion webkit2gtk-4.0)" ge '2.40'

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Build production application
        run: go run github.com/wailsapp/wails/v2/cmd/wails@v2.13.0 build -tags webkit2_40

      - name: Inspect application binary
        shell: bash
        run: |
          test -x build/bin/osverse
          file build/bin/osverse
          ldd build/bin/osverse

      - name: Package Ubuntu 22.04 release candidates
        env:
          SOURCE_DATE_EPOCH: '0'
        run: |
          build/linux/fetch-appimage-tools.sh build/tools/appimage
          build/linux/package.sh 0.0.0-ci build/bin/osverse ubuntu22.04 build/release/ubuntu22.04 build/tools/appimage

      - name: Verify Ubuntu 22.04 package checksums
        working-directory: build/release/ubuntu22.04
        run: sha256sum --check SHA256SUMS-ubuntu22.04

      - name: Install, remove, and launch Ubuntu 22.04 packages
        run: build/linux/smoke-packages.sh build/release/ubuntu22.04 ubuntu22.04

      - name: Upload Ubuntu 22.04 binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: osverse-linux-amd64-ubuntu22.04
          path: build/release/ubuntu22.04/*
          if-no-files-found: error
          retention-days: 7

  linux-ubuntu20:
    name: Ubuntu 20.04 compatibility build
    if: github.event_name != 'pull_request' || github.base_ref == 'dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    container:
      image: ubuntu:20.04@sha256:8feb4d8ca5354def3d8fce243717141ce31e2c428701f6682bd2fafe15388214
    steps:
      # GitHub's current JavaScript actions use Node 24. Install their runtime
      # libraries and checkout's git dependency before invoking any action.
      - name: Install container and native build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install --no-install-recommends --yes \
            build-essential \
            ca-certificates \
            curl \
            file \
            git \
            gnupg \
            libgtk-3-dev \
            libstdc++6 \
            libwebkit2gtk-4.0-dev \
            pkg-config \
            policykit-1 \
            squashfs-tools \
            xauth \
            xdotool \
            xvfb \
            xz-utils

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.12'
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false

      - name: Verify compatibility toolchain
        shell: bash
        run: |
          test "$(go env GOVERSION)" = 'go1.25.12'
          test "$(node --version)" = 'v22.23.2'
          test "$(uname -m)" = 'x86_64'
          pkg-config --exists gtk+-3.0 webkit2gtk-4.0

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      # Focal currently ships WebKitGTK 2.38.6. Wails' webkit2_40 tag
      # requires library version 2.40+, while webkit2_36 supports Focal's
      # ABI-compatible 4.0 package and preserves the glibc 2.31 baseline.
      - name: Build Ubuntu 20.04-compatible application
        run: go run github.com/wailsapp/wails/v2/cmd/wails@v2.13.0 build -tags webkit2_36

      - name: Inspect application binary
        shell: bash
        run: |
          test -x build/bin/osverse
          file build/bin/osverse
          ldd build/bin/osverse

      - name: Package Ubuntu 20.04 release candidates
        env:
          SOURCE_DATE_EPOCH: '0'
        run: |
          build/linux/fetch-appimage-tools.sh build/tools/appimage
          build/linux/package.sh 0.0.0-ci build/bin/osverse ubuntu20.04 build/release/ubuntu20.04 build/tools/appimage

      - name: Verify Ubuntu 20.04 package checksums
        working-directory: build/release/ubuntu20.04
        run: sha256sum --check SHA256SUMS-ubuntu20.04

      - name: Install, remove, and launch Ubuntu 20.04 packages
        run: build/linux/smoke-packages.sh build/release/ubuntu20.04 ubuntu20.04

      - name: Upload Ubuntu 20.04-compatible binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: osverse-linux-amd64-ubuntu20.04
          path: build/release/ubuntu20.04/*
          if-no-files-found: error
          retention-days: 7
