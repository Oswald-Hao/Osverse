name: CI

on:
  push:
    branches:
      - dev
      - beta
      - main
  pull_request:
    branches:
      - dev
      - beta
      - main

permissions:
  contents: read

jobs:
  go:
    name: Go tests and vet
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.12'
          cache: false

      - name: Install Go test native dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            build-essential \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev \
            pkg-config

      - name: Verify Go version
        shell: bash
        run: test "$(go env GOVERSION)" = 'go1.25.12'

      - name: Run Go tests
        run: |
          go mod verify
          go test ./...

      - name: Run race tests
        run: go test -race ./...

      - name: Run Go vet
        run: go vet ./...

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false

      - name: Verify Node.js version
        shell: bash
        run: test "$(node --version)" = 'v22.23.2'

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Run frontend tests
        run: npm --prefix frontend test

      - name: Type-check frontend
        run: npm --prefix frontend run typecheck

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Audit dependency graph
        run: npm --prefix frontend audit --audit-level=high

      - name: Audit responsive desktop breakpoints
        run: npm --prefix frontend run audit:responsive

  linux-webkitgtk-4:
    name: Ubuntu 22.04 WebKitGTK 4.0 build
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.12'
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false

      - name: Install native build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            build-essential \
            curl \
            file \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev \
            pkg-config \
            squashfs-tools \
            xauth \
            xvfb

      - name: Verify build toolchain
        shell: bash
        run: |
          test "$(go env GOVERSION)" = 'go1.25.12'
          test "$(node --version)" = 'v22.23.2'
          test "$(uname -m)" = 'x86_64'
          dpkg --compare-versions "$(pkg-config --modversion webkit2gtk-4.0)" ge '2.40'

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Build production application
        run: go run github.com/wailsapp/wails/v2/cmd/wails@v2.13.0 build -tags webkit2_40

      - name: Inspect application binary
        shell: bash
        run: |
          test -x build/bin/osverse
          file build/bin/osverse
          ldd build/bin/osverse

      - name: Package Ubuntu 22.04 release candidates
        env:
          SOURCE_DATE_EPOCH: '0'
        run: |
          build/linux/fetch-appimage-tools.sh build/tools/appimage
          build/linux/package.sh 0.0.0-ci build/bin/osverse ubuntu22.04 build/release/ubuntu22.04 build/tools/appimage

      - name: Verify Ubuntu 22.04 package checksums
        working-directory: build/release/ubuntu22.04
        run: sha256sum --check SHA256SUMS-ubuntu22.04

      - name: Smoke-test Ubuntu 22.04 AppImage
        shell: bash
        run: |
          appimage=$(find build/release/ubuntu22.04 -maxdepth 1 -name '*.AppImage' -print -quit)
          test -n "$appimage"
          set +e
          timeout 10s xvfb-run --auto-servernum env APPIMAGE_EXTRACT_AND_RUN=1 "$appimage"
          status=$?
          set -e
          test "$status" -eq 124

      - name: Upload Ubuntu 22.04 binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: osverse-linux-amd64-ubuntu22.04
          path: build/release/ubuntu22.04/*
          if-no-files-found: error
          retention-days: 7

  linux-ubuntu20:
    name: Ubuntu 20.04 compatibility build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    container:
      image: ubuntu:20.04@sha256:8feb4d8ca5354def3d8fce243717141ce31e2c428701f6682bd2fafe15388214
    steps:
      # GitHub's current JavaScript actions use Node 24. Install their runtime
      # libraries and checkout's git dependency before invoking any action.
      - name: Install container and native build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install --no-install-recommends --yes \
            build-essential \
            ca-certificates \
            curl \
            file \
            git \
            libgtk-3-dev \
            libstdc++6 \
            libwebkit2gtk-4.0-dev \
            pkg-config \
            squashfs-tools \
            xauth \
            xvfb \
            xz-utils

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.12'
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false

      - name: Verify compatibility toolchain
        shell: bash
        run: |
          test "$(go env GOVERSION)" = 'go1.25.12'
          test "$(node --version)" = 'v22.23.2'
          test "$(uname -m)" = 'x86_64'
          pkg-config --exists gtk+-3.0 webkit2gtk-4.0

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      # Focal currently ships WebKitGTK 2.38.6. Wails' webkit2_40 tag
      # requires library version 2.40+, while webkit2_36 supports Focal's
      # ABI-compatible 4.0 package and preserves the glibc 2.31 baseline.
      - name: Build Ubuntu 20.04-compatible application
        run: go run github.com/wailsapp/wails/v2/cmd/wails@v2.13.0 build -tags webkit2_36

      - name: Inspect application binary
        shell: bash
        run: |
          test -x build/bin/osverse
          file build/bin/osverse
          ldd build/bin/osverse

      - name: Package Ubuntu 20.04 release candidates
        env:
          SOURCE_DATE_EPOCH: '0'
        run: |
          build/linux/fetch-appimage-tools.sh build/tools/appimage
          build/linux/package.sh 0.0.0-ci build/bin/osverse ubuntu20.04 build/release/ubuntu20.04 build/tools/appimage

      - name: Verify Ubuntu 20.04 package checksums
        working-directory: build/release/ubuntu20.04
        run: sha256sum --check SHA256SUMS-ubuntu20.04

      - name: Smoke-test Ubuntu 20.04 AppImage
        shell: bash
        run: |
          appimage=$(find build/release/ubuntu20.04 -maxdepth 1 -name '*.AppImage' -print -quit)
          test -n "$appimage"
          set +e
          timeout 10s xvfb-run --auto-servernum env APPIMAGE_EXTRACT_AND_RUN=1 "$appimage"
          status=$?
          set -e
          test "$status" -eq 124

      - name: Upload Ubuntu 20.04-compatible binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: osverse-linux-amd64-ubuntu20.04
          path: build/release/ubuntu20.04/*
          if-no-files-found: error
          retention-days: 7
